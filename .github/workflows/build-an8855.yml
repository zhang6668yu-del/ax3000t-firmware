name: Check AX3000T AN8855 Targets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone source
        run: |
          git clone --depth=1 \
            --branch openwrt-24.10-6.6 \
            https://github.com/padavanonly/immortalwrt-mt798x-6.6.git openwrt

      - name: Show AN8855 related targets
        working-directory: openwrt
        run: |
          echo "===== filogic.mk matches ====="
          grep -n -A25 -B5 -Ei \
            'ax3000t.*an8855|an8855.*ax3000t' \
            target/linux/mediatek/image/filogic.mk || true

          echo "===== DTS / DTSI matches ====="
          find target/linux/mediatek -type f \
            | grep -Ei 'ax3000t.*an8855|an8855.*ax3000t' || true
