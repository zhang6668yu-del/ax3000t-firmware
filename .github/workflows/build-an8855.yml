name: AX3000T H-Uboot 112M Official 24.10.2 - MT7531 and AN8855

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/build-an8855.yml', 'scripts/**']
  push:
    branches: [main, 'codex/**']
    paths: ['.github/workflows/build-an8855.yml', 'scripts/**']

permissions:
  contents: write
concurrency:
  group: ax3000t-112m-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        switch: [mt7531, an8855]
    env:
      OFFICIAL_TAG: v24.10.2
      PROFILE: xiaomi_mi-router-ax3000t-${{ matrix.switch }}-mtkuboot
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-pyelftools rsync unzip zlib1g-dev file wget curl jq qemu-utils ccache xsltproc libelf-dev swig time qemu-user-static proot
          df -h
      - name: Clone official ImmortalWrt v24.10.2 release source
        run: |
          git init openwrt
          git -C openwrt remote add origin https://github.com/immortalwrt/immortalwrt.git
          git -C openwrt fetch --depth=1 origin tag "$OFFICIAL_TAG"
          git -C openwrt checkout --detach FETCH_HEAD
      - name: Update and install official feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Prepare switch profile, 112M layout, upstream mt76 Wi-Fi and clean configuration
        run: |
          python3 scripts/prepare.py openwrt '${{ matrix.switch }}'
          make -C openwrt defconfig
          mkdir -p audit
          cp openwrt/.config audit/config.resolved
          cp openwrt/target/linux/mediatek/dts/*xiaomi* audit/
          cp openwrt/target/linux/mediatek/filogic/config-6.6 audit/kernel.config
          cp openwrt/target/linux/mediatek/image/filogic.mk audit/
          git -C openwrt diff > audit/source.patch
          git -C openwrt rev-parse HEAD > audit/source.sha
          grep -E '^CONFIG_TARGET_|^CONFIG_PACKAGE_(luci-ssl|libustream|kmod-nft|kmod-tun|kmod-inet|nftables|kmod-mt7915e)' openwrt/.config || true
          grep -qx "CONFIG_TARGET_mediatek_filogic_DEVICE_${PROFILE}=y" openwrt/.config
      - name: Download sources
        working-directory: openwrt
        run: make download -j8
      - name: Build firmware
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee ../build.log || make -j1 V=s 2>&1 | tee -a ../build.log
      - name: Collect firmware
        run: python3 scripts/collect.py openwrt '${{ matrix.switch }}'
      - name: Audit firmware and verify official opkg feeds
        run: |
          set -o pipefail
          python3 scripts/check_firmware.py openwrt '${{ matrix.switch }}' 2>&1 | tee audit.log
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AX3000T-${{ matrix.switch }}-H-Uboot-112M-24.10.2
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.switch }}-${{ github.run_id }}
          path: |
            audit/
            build.log
            audit.log
          retention-days: 14
