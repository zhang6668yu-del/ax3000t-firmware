name: Check AX3000T AN8855 Targets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone source
        run: |
          git clone --depth=1 \
            --branch openwrt-24.10-6.6 \
            https://github.com/padavanonly/immortalwrt-mt798x-6.6.git openwrt

      - name: Search all AN8855 references
        working-directory: openwrt
        run: |
          echo "===== ALL AN8855 REFERENCES ====="
          grep -Rni --exclude-dir=.git "an8855" target/linux/mediatek 2>/dev/null || true

          echo "===== AX3000T REFERENCES ====="
          grep -Rni --exclude-dir=.git "ax3000t" target/linux/mediatek 2>/dev/null || true

          echo "===== FILOGIC DEVICE DEFINITIONS ====="
          grep -n "define Device/xiaomi_mi-router-ax3000t" \
            target/linux/mediatek/image/filogic.mk || true

          echo "===== RELATED DTS FILES ====="
          find target/linux/mediatek \
            -type f \
            \( -iname '*ax3000t*' -o -iname '*an8855*' \) \
            -print || true
