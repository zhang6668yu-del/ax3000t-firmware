name: AX3000T H-Uboot 112M - MT7531 and AN8855

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/build-an8855.yml', 'scripts/**']
  push:
    branches: [main]
    paths: ['.github/workflows/build-an8855.yml', 'scripts/**']

permissions:
  contents: read
concurrency:
  group: ax3000t-112m-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        switch: [mt7531, an8855]
    env:
      SOURCE_SHA: ec9ef10efc65da1e6d1de4e2c043c0e13d08eed8
      PROFILE: xiaomi_mi-router-ax3000t-${{ matrix.switch }}-mtkuboot
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-pyelftools rsync unzip zlib1g-dev file wget curl jq qemu-utils ccache xsltproc libelf-dev swig time
          df -h
      - name: Clone pinned ImmortalWrt 24.10 source
        run: |
          git init openwrt
          git -C openwrt remote add origin https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
          git -C openwrt fetch --depth=1 origin "$SOURCE_SHA"
          git -C openwrt checkout --detach FETCH_HEAD
      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Prepare separate switch profile and clean configuration
        run: |
          python3 scripts/prepare.py openwrt '${{ matrix.switch }}'
          make -C openwrt defconfig
          mkdir -p audit
          cp openwrt/.config audit/config.resolved
          cp openwrt/target/linux/mediatek/dts/*xiaomi* audit/
          cp openwrt/target/linux/mediatek/filogic/config-6.6 audit/kernel.config
          cp openwrt/target/linux/mediatek/image/filogic.mk audit/
          git -C openwrt diff > audit/source.patch
          git -C openwrt rev-parse HEAD > audit/source.sha
          for feed in openwrt/feeds/*; do
            [ ! -d "$feed/.git" ] || printf '%s %s\n' "$feed" "$(git -C "$feed" rev-parse HEAD)"
          done > audit/feeds.sha
          grep -E '^CONFIG_TARGET_|^CONFIG_PACKAGE_(luci-ssl|libustream|kmod-nft|kmod-tun|kmod-inet|nftables)' openwrt/.config || true
          # Target selection is essential. Package resolution is shown above.
          grep -qx "CONFIG_TARGET_mediatek_filogic_DEVICE_${PROFILE}=y" openwrt/.config
      - name: Download sources
        working-directory: openwrt
        run: make download -j8
      - name: Build firmware with serial failure diagnostics
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee ../build.log || make -j1 V=s 2>&1 | tee -a ../build.log
      - name: Collect and audit firmware
        run: python3 scripts/collect.py openwrt '${{ matrix.switch }}'
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: AX3000T-${{ matrix.switch }}-H-Uboot-112M-24.10
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.switch }}-${{ github.run_id }}
          path: |
            audit/
            build.log
          retention-days: 14
