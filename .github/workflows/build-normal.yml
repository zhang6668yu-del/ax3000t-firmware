name: Build AX3000T H-Uboot 112M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev \
            python3 python3-pyelftools \
            rsync unzip zlib1g-dev file wget curl jq \
            qemu-utils ccache xsltproc libelf-dev swig time

      - name: Clone ImmortalWrt MT798x
        run: |
          git clone --depth=1 \
            --branch openwrt-24.10-6.6 \
            https://github.com/padavanonly/immortalwrt-mt798x-6.6.git openwrt

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify AX3000T 112M target
        working-directory: openwrt
        run: |
          grep -q "define Device/xiaomi_mi-router-ax3000t-mtkuboot" \
            target/linux/mediatek/image/filogic.mk

          grep -A20 \
            "define Device/xiaomi_mi-router-ax3000t-mtkuboot" \
            target/linux/mediatek/image/filogic.mk

      - name: Create firmware config
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t-mtkuboot=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y

          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_openssh-sftp-server=y

          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_PACKAGE_nftables=y

          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-queue=y
          CONFIG_PACKAGE_kmod-inet-diag=y

          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-base64=y
          EOF

          make defconfig

        - name: Diagnose selected configuration
        working-directory: openwrt
        run: |
          echo "===== TARGET ====="
          grep 'ax3000t-mtkuboot' .config || true

          echo "===== kmod-tun ====="
          grep 'CONFIG_PACKAGE_kmod-tun' .config || true

          echo "===== kmod-nft-socket ====="
          grep 'CONFIG_PACKAGE_kmod-nft-socket' .config || true

          echo "===== kmod-nft-tproxy ====="
          grep 'CONFIG_PACKAGE_kmod-nft-tproxy' .config || true

          echo "===== kmod-nft-queue ====="
          grep 'CONFIG_PACKAGE_kmod-nft-queue' .config || true

          echo "===== kmod-inet-diag ====="
          grep 'CONFIG_PACKAGE_kmod-inet-diag' .config || true

          echo "===== ip-full ====="
          grep 'CONFIG_PACKAGE_ip-full' .config || true

          echo "===== iptables-nft ====="
          grep 'CONFIG_PACKAGE_iptables-nft' .config || true

          echo "===== nftables ====="
          grep 'CONFIG_PACKAGE_nftables' .config || true
      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s

      - name: Show firmware files
        working-directory: openwrt
        run: |
          ls -lh bin/targets/mediatek/filogic/

      - name: Verify firmware files
        working-directory: openwrt
        run: |
          test -n "$(find bin/targets/mediatek/filogic \
            -maxdepth 1 -type f \
            -name '*ax3000t-mtkuboot*factory.bin' \
            -print -quit)"

          test -n "$(find bin/targets/mediatek/filogic \
            -maxdepth 1 -type f \
            -name '*ax3000t-mtkuboot*sysupgrade.bin' \
            -print -quit)"

          echo "Factory and sysupgrade firmware found"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: AX3000T-MT753x-H-Uboot-112M-24.10
          if-no-files-found: error
          path: |
            openwrt/bin/targets/mediatek/filogic/*ax3000t-mtkuboot*factory.bin
            openwrt/bin/targets/mediatek/filogic/*ax3000t-mtkuboot*sysupgrade.bin
            openwrt/bin/targets/mediatek/filogic/sha256sums
            openwrt/bin/targets/mediatek/filogic/config.buildinfo
            openwrt/bin/targets/mediatek/filogic/profiles.json
