name: Build AX3000T H-Uboot 112M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-pyelftools \
            rsync unzip zlib1g-dev file wget curl jq \
            qemu-utils ccache xsltproc libelf-dev swig time

      - name: Clone ImmortalWrt MT798x
        run: |
          git clone --depth=1 \
            --branch openwrt-24.10-6.6 \
            https://github.com/padavanonly/immortalwrt-mt798x-6.6.git openwrt

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify AX3000T MTK U-Boot 112M target
        working-directory: openwrt
        run: |
          grep -A25 -B2 "define Device/xiaomi_mi-router-ax3000t-mtkuboot" \
            target/linux/mediatek/image/filogic.mk

          grep -q "IMAGE_SIZE := 114688k" \
            target/linux/mediatek/image/filogic.mk

          echo "AX3000T MTK U-Boot 112M target found."

      - name: Create firmware config
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t-mtkuboot=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y

          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_openssh-sftp-server=y

          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_PACKAGE_nftables=y

          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-queue=y
          CONFIG_PACKAGE_kmod-inet-diag=y

          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-base64=y
          EOF

          make defconfig

      - name: Verify target and required base dependencies
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          check_config() {
            local cfg="$1"
            if ! grep -qx "$cfg" .config; then
              echo "ERROR: Missing required config: $cfg"
              exit 1
            fi
            echo "OK: $cfg"
          }

          check_config "CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t-mtkuboot=y"
          check_config "CONFIG_PACKAGE_kmod-tun=y"
          check_config "CONFIG_PACKAGE_kmod-nft-socket=y"
          check_config "CONFIG_PACKAGE_kmod-nft-tproxy=y"
          check_config "CONFIG_PACKAGE_kmod-nft-queue=y"
          check_config "CONFIG_PACKAGE_kmod-inet-diag=y"
          check_config "CONFIG_PACKAGE_ip-full=y"
          check_config "CONFIG_PACKAGE_iptables-nft=y"
          check_config "CONFIG_PACKAGE_nftables=y"

          echo "All required target and base dependency configs are enabled."

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j$(nproc)

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s

      - name: Verify firmware output
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          OUT="bin/targets/mediatek/filogic"

          echo "Firmware files:"
          ls -lh "$OUT"

          FACTORY_FILE=$(find "$OUT" -maxdepth 1 -type f \
            -name '*xiaomi_mi-router-ax3000t-mtkuboot*factory.bin' \
            | head -n 1)

          SYSUPGRADE_FILE=$(find "$OUT" -maxdepth 1 -type f \
            -name '*xiaomi_mi-router-ax3000t-mtkuboot*sysupgrade.bin' \
            | head -n 1)

          if [ -z "$FACTORY_FILE" ]; then
            echo "ERROR: factory.bin not found."
            exit 1
          fi

          if [ -z "$SYSUPGRADE_FILE" ]; then
            echo "ERROR: sysupgrade.bin not found."
            exit 1
          fi

          echo "Factory firmware:"
          ls -lh "$FACTORY_FILE"

          echo "Sysupgrade firmware:"
          ls -lh "$SYSUPGRADE_FILE"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: AX3000T-MT753x-H-Uboot-112M-24.10
          if-no-files-found: error
          path: |
            openwrt/bin/targets/mediatek/filogic/*xiaomi_mi-router-ax3000t-mtkuboot*factory.bin
            openwrt/bin/targets/mediatek/filogic/*xiaomi_mi-router-ax3000t-mtkuboot*sysupgrade.bin
            openwrt/bin/targets/mediatek/filogic/sha256sums
            openwrt/bin/targets/mediatek/filogic/config.buildinfo
            openwrt/bin/targets/mediatek/filogic/profiles.json
