name: CMCC XR30 NAND 25.12 MTK Closed-Source Minimal
on:
  workflow_dispatch:
    inputs:
      OP_IP:
        description: 'Router IP'
        required: false
        default: '192.168.2.1'
        type: string
  push:
    branches: [codex/router-minimal-20261026]
    paths: ['.github/workflows/build-xr30-nand.yml', 'xr30/**']
permissions:
  contents: write
  actions: read
concurrency:
  group: xr30-nand
  cancel-in-progress: false
jobs:
  build_firmware:
    name: Build CMCC XR30 NAND Minimal
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libfuse-dev clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev qemu-utils ccache
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Set environment variables
        run: |
          echo "tag=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "OP_IP=${{ github.event.inputs.OP_IP || '192.168.2.1' }}" >> $GITHUB_ENV
          echo "DEVICE_NAME=xr30-nand" >> $GITHUB_ENV
          echo "SOURCE_NAME=openwrt" >> $GITHUB_ENV
          echo "REPO_URL=https://github.com/shiyu1314/openwrt-source" >> $GITHUB_ENV
          echo "REPO_BRANCH=openwrt-25.12" >> $GITHUB_ENV

      - name: Clone openwrt-source
        working-directory: /workdir
        run: |
          git clone $REPO_URL $SOURCE_NAME
          ln -sf /workdir/$SOURCE_NAME $GITHUB_WORKSPACE/$SOURCE_NAME

      - name: Switch branch
        run: |
          cd $SOURCE_NAME
          _release_tag=$(git tag --sort=taggerdate --list 'v25.*' | tail -1)
          git checkout $_release_tag
          echo "release_tag=$_release_tag" >> $GITHUB_ENV

      - name: Restore toolchain cache
        uses: actions/cache@v4
        with:
          path: openwrt/staging_dir
          key: openwrt-filogic-xr30-toolchain-cache
          restore-keys: |
            openwrt-filogic-xr30-toolchain-cache
            openwrt-toolchain-cache

      - name: Apply patches
        run: |
          set -x
          cd $SOURCE_NAME
          find ./staging_dir/ -name '*' -exec touch {} \; >/dev/null 2>&1 || true
          ./scripts/feeds update -a
          cd $GITHUB_WORKSPACE
          cp -rf xr30/patch/diy/*.patch $SOURCE_NAME/
          cp -rf xr30/patch/luci/*.patch $SOURCE_NAME/feeds/luci/
          cp -rf xr30/patch/keys/* $SOURCE_NAME/

      - name: Load DIY scripts
        run: |
          chmod +x xr30/sh/op.sh
          cd $SOURCE_NAME
          $GITHUB_WORKSPACE/xr30/sh/op.sh
          cd $GITHUB_WORKSPACE
          cp -rf xr30/patch/nginx/luci.locations $SOURCE_NAME/feeds/packages/net/nginx/files-luci-support/
          cp -rf xr30/patch/nginx/uci.conf.template $SOURCE_NAME/feeds/packages/net/nginx-util/files/

      - name: Load custom configuration and files
        run: |
          cp -rf xr30/files $SOURCE_NAME/files
          cat << 'EOF' >> $SOURCE_NAME/.config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_xr30-nand=y
          EOF
          cat xr30/config/config-common >> $SOURCE_NAME/.config
          sed -i "s/192.168.1.1/${{ env.OP_IP }}/" $SOURCE_NAME/package/base-files/files/bin/config_generate

      - name: Download package dependencies
        run: |
          cd $SOURCE_NAME
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
          cd $SOURCE_NAME
          echo "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Organize output images
        run: |
          mkdir -p delivery
          cd $SOURCE_NAME/bin/targets/*/*
          cp -f *xr30-nand*sysupgrade.bin $GITHUB_WORKSPACE/delivery/ 2>/dev/null || true
          cp -f *xr30-nand*factory.bin $GITHUB_WORKSPACE/delivery/ 2>/dev/null || true
          cp -f *xr30-nand*.manifest $GITHUB_WORKSPACE/delivery/ 2>/dev/null || true
          cp -f sha256sums $GITHUB_WORKSPACE/delivery/ 2>/dev/null || true
          cd $GITHUB_WORKSPACE/delivery
          ls -la

      - name: Upload XR30 firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: CMCC-XR30-NAND-25.12-MTK-ClosedSource-Minimal
          if-no-files-found: error
          retention-days: 30
          path: delivery/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: xr30-v25.12-minimal
          name: CMCC XR30 NAND 25.12 MTK Closed-Source Driver Minimal
          files: delivery/*
          body: |
            CMCC XR30 NAND OpenWrt 25.12 with MTK Closed-Source Wi-Fi Driver
            - Material 3 Expressive (M3E) Theme
            - 12MB mt_wifi.ko closed-source driver + Hardware NAT (kmod-mediatek_hnat/kmod-warp)
            - Official clean mirrors (No 2yy.de5.net, no PassWall repos)
            - Essential kmods included: kmod-tun, kmod-nft-tproxy, kmod-nft-socket, kmod-inet-diag, kmod-nft-nat, kmod-nft-offload
            - Stripped bloat: no momo, no diskman, no duplicate proxies
