name: Redmi AX6000 110 MiB OpenWrt 25.12.5 minimal kernel dependencies
on:
  workflow_dispatch:
  push:
    branches: [codex/router-minimal-20261026]
    paths: ['.github/workflows/build-ax6000-110m-minimal.yml', 'scripts/**', 'files-ax6000-110m/**']
permissions:
  contents: read
concurrency:
  group: redmi-ax6000-110m
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev libssl-dev zlib1g-dev gawk gettext unzip rsync wget file python3 zstd squashfs-tools
      - name: Download and verify official ImageBuilder 25.12.5
        run: |
          curl --fail --location --retry 3 -o imagebuilder.tar.zst https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/openwrt-imagebuilder-25.12.5-mediatek-filogic.Linux-x86_64.tar.zst
          echo '7fb6cf626582ebcbfb46974da48c1eae577213f38879eaf6b1d982041e843461  imagebuilder.tar.zst' | sha256sum -c -
          mkdir imagebuilder
          tar --zstd -xf imagebuilder.tar.zst -C imagebuilder --strip-components=1
          rm imagebuilder.tar.zst
      - name: Prepare guarded single-UBI profile
        run: |
          python3 scripts/prepare_ax6000_110m.py imagebuilder
          chmod +x files-ax6000-110m/etc/board.d/99-ax6000-h110m
          sh -n files-ax6000-110m/lib/upgrade/platform.sh
          sh -n files-ax6000-110m/etc/board.d/99-ax6000-h110m
      - name: Build firmware with minimal kernel dependencies
        working-directory: imagebuilder
        run: |
          make image PROFILE=xiaomi_redmi-router-ax6000-stock FILES="${GITHUB_WORKSPACE}/files-ax6000-110m" PACKAGES="-dnsmasq dnsmasq-full luci luci-ssl luci-i18n-base-zh-cn luci-app-ttyd luci-i18n-ttyd-zh-cn ca-bundle ca-certificates bash curl wget-ssl unzip openssh-sftp-server ip-full kmod-tun kmod-inet-diag kmod-nft-socket kmod-nft-tproxy kmod-nft-nat"
      - name: Verify 112 MiB factory and sysupgrade images
        run: |
          mkdir delivery
          python3 scripts/verify_ax6000_110m.py imagebuilder/bin/targets/mediatek/filogic delivery
      - name: Verify shipped repositories
        run: |
          python3 scripts/check_runtime_repos.py imagebuilder delivery
      - name: Upload verified images and audit
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-AX6000-25.12.5-H-Uboot-110M-MinimalKernelDependencies
          if-no-files-found: error
          retention-days: 30
          path: delivery/
